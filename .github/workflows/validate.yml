name: Validate Caddy production authority

on:
  pull_request:
    branches: [development, test, staging, production, main]
  push:
    branches: [development, test, staging, production, main]

# Pull-request checks are credential-light. Package credentials are granted
# only to protected-branch push rollback verification after source validation.
permissions:
  contents: read

concurrency:
  group: caddy-authority-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate-source:
    name: validate-source
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out the exact source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove exact source identity
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Pin validation Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Validate GitHub Actions syntax and expressions
        run: bash scripts/validate-github-actions.sh
      - name: Validate the sole deployable Caddy tree
        run: bash scripts/validate-ci.sh

  validate-merge-result:
    name: validate-merge-result
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - name: Check out the exact synthetic merge result
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove exact merge-result identity
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Pin validation Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Validate GitHub Actions syntax and expressions
        run: bash scripts/validate-github-actions.sh
      - name: Validate the exact merge result
        run: bash scripts/validate-ci.sh

  promotion-guard:
    name: promotion-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Check out the exact promotion source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce the reviewed promotion chain
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
        run: bash scripts/validate-promotion-route.sh

  immutable-release-gate:
    name: immutable-release-gate
    needs: [validate-source]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
    env:
      EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      LOCAL_IMAGE: local/codestra-caddy:${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      CADDY_UPSTREAM_SHA: e2eee6a7fce366321294c9c2a79f3146891dcbdf
    steps:
      - name: Check out the exact source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove exact source identity
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Pin Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.9'
          cache: false
      - name: Build immutable release inputs
        run: bash scripts/build-release-inputs.sh
      - name: Build exact-head image
        run: |
          set -Eeuo pipefail
          CONFIG_SHA256="$(cat build/config-sha256.txt)"
          docker build \
            --build-arg "BUILD_CREATED=${{ github.event.pull_request.updated_at || github.event.head_commit.timestamp }}" \
            --build-arg "SOURCE_URL=${{ github.server_url }}/${{ github.repository }}" \
            --build-arg "VCS_REF=$EXPECTED_SHA" \
            --build-arg "VERSION=$EXPECTED_SHA" \
            --build-arg "CONFIG_SHA256=$CONFIG_SHA256" \
            --build-arg "CADDY_UPSTREAM_SHA=$CADDY_UPSTREAM_SHA" \
            --tag "$LOCAL_IMAGE" .
      - name: Prove non-root privileged-port binding
        run: tests/runtime-bind-test.sh "$LOCAL_IMAGE"
      - name: Run isolated route, TLS, mTLS, denial, and redaction canary
        run: tests/runtime-canary-test.sh "$LOCAL_IMAGE"
      - name: Scan exact image for HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: '1'
      - name: Record credential-free immutable gate
        run: |
          set -Eeuo pipefail
          printf 'SOURCE_SHA=%s\nCADDY_IMMUTABLE_PR_GATE=PASS\nPACKAGE_CREDENTIALS=NOT_GRANTED\n' \
            "$EXPECTED_SHA" > immutable-source-gate.txt
      - name: Upload immutable source-gate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: caddy-immutable-source-gate-${{ env.EXPECTED_SHA }}
          path: immutable-source-gate.txt
          if-no-files-found: error

  protected-rollback-gate:
    name: protected-rollback-gate
    if: github.event_name == 'push'
    needs: [validate-source]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - name: Check out exact protected-branch source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove rollback credentials are bound to a protected branch push
        run: |
          set -Eeuo pipefail
          test "$GITHUB_EVENT_NAME" = push
          branch="${GITHUB_REF#refs/heads/}"
          case "$branch" in
            development|test|staging|production|main) ;;
            *) echo CADDY_PROTECTED_ROLLBACK=FAIL:unexpected_branch >&2; exit 2 ;;
          esac
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git rev-parse --verify --quiet "refs/remotes/origin/$branch" >/dev/null
          test "$(git rev-parse "origin/$branch")" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
      - name: Install Cosign for protected rollback verification
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Authenticate to GHCR for the exact rollback baseline
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Rehearse the signed historical rollback baseline from protected code
        run: |
          set -o pipefail
          scripts/verify-rollback-baseline.sh | tee rollback-baseline-ci.txt
      - name: Upload protected rollback evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: caddy-protected-rollback-${{ env.EXPECTED_SHA }}
          path: rollback-baseline-ci.txt
          if-no-files-found: error

  validate:
    name: validate
    if: always()
    needs: [validate-source, validate-merge-result, promotion-guard, immutable-release-gate, protected-rollback-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Preserve the protected aggregate context
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE: ${{ needs.validate-source.result }}
          MERGE_RESULT: ${{ needs.validate-merge-result.result }}
          PROMOTION: ${{ needs.promotion-guard.result }}
          IMMUTABLE: ${{ needs.immutable-release-gate.result }}
          ROLLBACK: ${{ needs.protected-rollback-gate.result }}
        run: |
          set -Eeuo pipefail
          test "$SOURCE" = success
          test "$PROMOTION" = success
          test "$IMMUTABLE" = success
          if [[ "$EVENT_NAME" == pull_request ]]; then
            test "$MERGE_RESULT" = success
            test "$ROLLBACK" = skipped
            echo CADDY_PR_PACKAGE_CREDENTIALS=NOT_GRANTED
          else
            test "$MERGE_RESULT" = skipped
            test "$ROLLBACK" = success
            echo CADDY_PROTECTED_ROLLBACK=PASS
          fi
          echo CADDY_PROTECTED_AGGREGATE=PASS
