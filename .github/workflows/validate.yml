name: Validate Caddy source authority

on:
  pull_request:
  push:
    branches: [main, development, test, production]

permissions:
  contents: read

concurrency:
  group: caddy-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate-source:
    name: validate-source
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, codestra-ci]
    timeout-minutes: 20
    env:
      EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ env.EXPECTED_SHA }}
      - name: Verify exact source identity
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "SOURCE_SHA=$EXPECTED_SHA"
      - name: Pin validation Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Pin validation Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.14.0'
      - name: Install pinned validation dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input pytest==8.4.2
          npm install --prefix "$RUNNER_TEMP/caddy-newman" --no-audit --no-fund newman@6.2.2
          echo "$RUNNER_TEMP/caddy-newman/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Validate exact source and immutable Caddy configuration
        run: bash scripts/validate-ci.sh

  validate-merge-result:
    name: validate-merge-result
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, codestra-ci]
    timeout-minutes: 20
    env:
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - name: Check out exact merge-result SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ env.EXPECTED_SHA }}
      - name: Verify exact merge-result identity
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "MERGE_RESULT_SHA=$EXPECTED_SHA"
      - name: Pin validation Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Pin validation Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.14.0'
      - name: Install pinned validation dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input pytest==8.4.2
          npm install --prefix "$RUNNER_TEMP/caddy-newman" --no-audit --no-fund newman@6.2.2
          echo "$RUNNER_TEMP/caddy-newman/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Validate exact merge result and immutable Caddy configuration
        run: bash scripts/validate-ci.sh

  validate:
    name: validate
    if: always()
    needs: [validate-source, validate-merge-result]
    runs-on: [self-hosted, Linux, X64, codestra-ci]
    timeout-minutes: 2
    steps:
      - name: Preserve the protected legacy aggregate context
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_RESULT: ${{ needs.validate-source.result }}
          MERGE_RESULT: ${{ needs.validate-merge-result.result }}
        run: |
          set -Eeuo pipefail
          test "$SOURCE_RESULT" = success
          if [[ "$EVENT_NAME" == pull_request ]]; then
            test "$MERGE_RESULT" = success
          else
            test "$MERGE_RESULT" = skipped
          fi
