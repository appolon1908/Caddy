name: Reusable Codestra deploy readiness

on:
  workflow_call:
    inputs:
      repository_class:
        description: Repository workload class
        required: true
        type: string
      run_stack_tests:
        description: Run detected Node, Python, Go, Compose, and Docker checks
        required: true
        type: boolean
      artifact_strategy:
        description: auto, oci, or source-bundle
        required: true
        type: string
      dockerfile_path:
        description: Optional repository-relative Dockerfile path
        required: false
        type: string
        default: ""
      docker_build_context:
        description: Optional repository-relative Docker build context
        required: false
        type: string
        default: ""
      runtime_deployable:
        description: Whether protected staging and read-only production jobs are valid for this repository
        required: true
        type: boolean
      health_paths:
        description: Comma-separated health, readiness, and version paths
        required: false
        type: string
        default: ""
      operation:
        description: verify, release, deploy-staging-readonly, certify-staging-readonly, or promote-production-readonly
        required: false
        type: string
        default: verify
      confirmation:
        description: Fixed confirmation required for deployment operations
        required: false
        type: string
        default: ""
      canary_percent:
        description: Production read-only canary percentage; maximum 1
        required: false
        type: string
        default: "1"

permissions:
  contents: read

concurrency:
  group: deploy-readiness-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DEPLOY_READINESS_CONTRACT_VERSION: "2"
  REPOSITORY_CLASS: "${{ inputs.repository_class }}"
  RUN_STACK_TESTS: "${{ inputs.run_stack_tests }}"
  ARTIFACT_STRATEGY: "${{ inputs.artifact_strategy }}"
  RUNTIME_DEPLOYABLE: "${{ inputs.runtime_deployable }}"
  HEALTH_PATHS: "${{ inputs.health_paths }}"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  TRIVY_VERSION: "v0.72.0"
  TRIVY_SHA256: "bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea"
  COSIGN_VERSION: "v3.1.2"
  COSIGN_SHA256: "f7622ed3cf22e55e1ae6377c080979ff77a22da9981c11df222a2e444991e7cf"

jobs:
  source-ci:
    name: deploy-readiness / source-ci
    runs-on: [self-hosted, Linux, X64, codestra-ci]
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact clean checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git rev-parse --is-inside-work-tree)" = true
          echo "SOURCE_SHA=${EXPECTED_SHA}"
          echo "SOURCE_TREE=$(git rev-parse HEAD^{tree})"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Validate repository structure and configuration
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check --no-input PyYAML==6.0.3
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import pathlib
          import re
          import yaml

          root = pathlib.Path(".").resolve()
          excluded = {
              ".git", ".nuxt", ".output", ".venv", ".venv-ci", "__pycache__",
              "build", "coverage", "dist", "node_modules", "vendor",
          }
          conflict = re.compile(r"^(?:<{7}|={7}|>{7})(?: .*)?$", re.MULTILINE)
          counts = {"json": 0, "yaml": 0, "text": 0}

          for path in root.rglob("*"):
              rel = path.relative_to(root)
              if any(part in excluded for part in rel.parts):
                  continue
              if path.is_symlink():
                  target = path.resolve(strict=False)
                  try:
                      target.relative_to(root)
                  except ValueError:
                      raise SystemExit(f"symlink escapes repository: {rel} -> {target}")
              if not path.is_file():
                  continue
              if path.stat().st_size > 50 * 1024 * 1024:
                  raise SystemExit(f"tracked file exceeds 50 MiB: {rel}")
              if path.stat().st_size > 5 * 1024 * 1024:
                  continue

              suffix = path.suffix.lower()
              if suffix == ".json":
                  json.loads(path.read_text(encoding="utf-8"))
                  counts["json"] += 1
              elif suffix in {".yaml", ".yml"}:
                  list(yaml.safe_load_all(path.read_text(encoding="utf-8")))
                  counts["yaml"] += 1

              if suffix in {
                  ".c", ".cc", ".cpp", ".css", ".go", ".h", ".html", ".java",
                  ".js", ".json", ".jsx", ".md", ".mdx", ".php", ".py", ".rb",
                  ".rs", ".sh", ".sql", ".ts", ".tsx", ".txt", ".vue", ".yaml", ".yml",
              }:
                  text = path.read_text(encoding="utf-8", errors="replace")
                  if conflict.search(text):
                      raise SystemExit(f"unresolved merge marker: {rel}")
                  counts["text"] += 1

          print("REPOSITORY_CLASS=" + os.environ["REPOSITORY_CLASS"])
          print("HEALTH_PATHS=" + os.environ["HEALTH_PATHS"])
          print("VALIDATED_JSON_FILES=" + str(counts["json"]))
          print("VALIDATED_YAML_FILES=" + str(counts["yaml"]))
          print("VALIDATED_TEXT_FILES=" + str(counts["text"]))
          print("STRUCTURE_VALIDATION=PASS")
          PY
          git diff --check

      - name: Detect source stacks
        id: stacks
        env:
          CONFIGURED_DOCKERFILE: ${{ inputs.dockerfile_path }}
        run: |
          set -Eeuo pipefail
          has_node=false
          has_python=false
          has_go=false
          has_docker=false
          find . -maxdepth 5 -type f -name package.json -not -path '*/node_modules/*' -print -quit | grep -q . && has_node=true || true
          find . -maxdepth 5 -type f \( -name pyproject.toml -o -name requirements.txt -o -name requirements.lock -o -name setup.py \) -print -quit | grep -q . && has_python=true || true
          find . -maxdepth 5 -type f -name go.mod -not -path '*/vendor/*' -print -quit | grep -q . && has_go=true || true
          find . -maxdepth 5 -type f -name Dockerfile -print -quit | grep -q . && has_docker=true || true
          [[ -n "$CONFIGURED_DOCKERFILE" ]] && has_docker=true
          echo "node=${has_node}" >> "$GITHUB_OUTPUT"
          echo "python=${has_python}" >> "$GITHUB_OUTPUT"
          echo "go=${has_go}" >> "$GITHUB_OUTPUT"
          echo "docker=${has_docker}" >> "$GITHUB_OUTPUT"
          echo "NODE=${has_node}"
          echo "PYTHON=${has_python}"
          echo "GO=${has_go}"
          echo "DOCKER=${has_docker}"

      - name: Set up Node.js
        if: inputs.run_stack_tests && steps.stacks.outputs.node == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.14.0"

      - name: Run Node.js projects
        if: inputs.run_stack_tests && steps.stacks.outputs.node == 'true'
        run: |
          set -Eeuo pipefail
          while IFS= read -r manifest; do
            directory="$(dirname "$manifest")"
            echo "NODE_PROJECT=${directory}"
            pushd "$directory" >/dev/null
            if [[ -f package-lock.json ]]; then
              npm ci --legacy-peer-deps --no-audit --fund=false
              runner=(npm run)
              auditor=(npm audit --omit=dev --audit-level=high)
            elif [[ -f pnpm-lock.yaml ]]; then
              corepack enable
              pnpm install --frozen-lockfile
              runner=(pnpm run)
              auditor=(pnpm audit --prod --audit-level high)
            elif [[ -f yarn.lock ]]; then
              corepack enable
              yarn install --immutable || yarn install --frozen-lockfile
              runner=(yarn run)
              yarn_major="$(yarn --version | cut -d. -f1)"
              if (( yarn_major >= 2 )); then
                auditor=(yarn npm audit --environment production --severity high)
              else
                auditor=(yarn audit --groups dependencies --level high)
              fi
            else
              npm install --legacy-peer-deps --no-audit --fund=false
              runner=(npm run)
              auditor=(npm audit --omit=dev --audit-level=high)
            fi
            for script in lint typecheck test build; do
              if node -e 'const p=require("./package.json"); process.exit(p.scripts && typeof p.scripts[process.argv[1]]==="string" ? 0 : 1)' "$script"; then
                "${runner[@]}" "$script"
              fi
            done
            "${auditor[@]}"
            popd >/dev/null
          done < <(find . -maxdepth 5 -type f -name package.json -not -path '*/node_modules/*' | sort)

      - name: Run Python projects
        if: inputs.run_stack_tests && steps.stacks.outputs.python == 'true'
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from __future__ import annotations

          import pathlib
          import shutil
          import subprocess
          import sys

          root = pathlib.Path(".").resolve()
          excluded = {".git", ".venv", ".venv-ci", "__pycache__", "node_modules", "vendor"}
          roots: set[pathlib.Path] = set()
          for name in ("pyproject.toml", "requirements.lock", "requirements.txt", "setup.py"):
              for path in root.rglob(name):
                  rel = path.relative_to(root)
                  if any(part in excluded for part in rel.parts) or len(rel.parts) > 5:
                      continue
                  roots.add(path.parent)

          for directory in sorted(roots):
              print(f"PYTHON_PROJECT={directory.relative_to(root) or pathlib.Path('.')}", flush=True)
              venv = directory / ".venv-ci"
              shutil.rmtree(venv, ignore_errors=True)
              subprocess.run([sys.executable, "-m", "venv", str(venv)], cwd=directory, check=True)
              python = venv / "bin" / "python"
              subprocess.run([str(python), "-m", "pip", "install", "--disable-pip-version-check", "--no-input", "--upgrade", "pip"], cwd=directory, check=True)
              requirement = next((directory / name for name in ("requirements.lock", "requirements.txt") if (directory / name).is_file()), None)
              if requirement:
                  subprocess.run([str(python), "-m", "pip", "install", "--disable-pip-version-check", "--no-input", "-r", requirement.name], cwd=directory, check=True)
              elif (directory / "pyproject.toml").is_file():
                  subprocess.run([str(python), "-m", "pip", "install", "--disable-pip-version-check", "--no-input", "-e", "."], cwd=directory, check=True)
              subprocess.run([str(python), "-m", "compileall", "-q", "."], cwd=directory, check=True)
              if (directory / "tests").is_dir():
                  subprocess.run([str(python), "-m", "pip", "install", "--disable-pip-version-check", "--no-input", "pytest==8.4.2"], cwd=directory, check=True)
                  subprocess.run([str(python), "-m", "pytest", "-q"], cwd=directory, check=True)
              subprocess.run([str(python), "-m", "pip", "check"], cwd=directory, check=True)
              shutil.rmtree(venv, ignore_errors=True)
          PY

      - name: Run Go modules
        if: inputs.run_stack_tests && steps.stacks.outputs.go == 'true'
        env:
          GOTOOLCHAIN: auto
          GOWORK: "off"
        run: |
          set -Eeuo pipefail
          while IFS= read -r module; do
            directory="$(dirname "$module")"
            echo "GO_MODULE=${directory}"
            (
              cd "$directory"
              go mod verify
              go test ./...
              go vet ./...
            )
          done < <(find . -maxdepth 5 -type f -name go.mod -not -path '*/vendor/*' | sort)

      - name: Validate Compose files
        if: inputs.run_stack_tests
        run: |
          set -Eeuo pipefail
          while IFS= read -r compose; do
            echo "COMPOSE_FILE=${compose}"
            compose_dir="$(dirname "$compose")"
            args=()
            if [[ -f "${compose_dir}/.env.example" ]]; then
              args+=(--env-file "${compose_dir}/.env.example")
            fi
            docker compose "${args[@]}" -f "$compose" config --quiet
          done < <(find . -maxdepth 5 -type f \( -name compose.yml -o -name compose.yaml -o -name docker-compose.yml -o -name docker-compose.yaml \) | sort)

      - name: Build primary container without publishing
        if: inputs.run_stack_tests && steps.stacks.outputs.docker == 'true'
        env:
          CONFIGURED_DOCKERFILE: ${{ inputs.dockerfile_path }}
          CONFIGURED_BUILD_CONTEXT: ${{ inputs.docker_build_context }}
        run: |
          set -Eeuo pipefail
          readarray -t container_paths < <(python - <<'PY'
          import os
          import pathlib

          root = pathlib.Path.cwd().resolve()

          def resolve_relative(value: str, *, kind: str) -> pathlib.Path:
              candidate = pathlib.Path(value)
              if candidate.is_absolute() or ".." in candidate.parts:
                  raise SystemExit(f"BUILD_ERROR={kind} must be repository-relative")
              resolved = (root / candidate).resolve()
              try:
                  resolved.relative_to(root)
              except ValueError:
                  raise SystemExit(f"BUILD_ERROR={kind} escapes repository")
              return resolved

          configured_dockerfile = os.environ["CONFIGURED_DOCKERFILE"]
          if configured_dockerfile:
              dockerfile = resolve_relative(configured_dockerfile, kind="dockerfile_path")
              if not dockerfile.is_file():
                  raise SystemExit("BUILD_ERROR=configured Dockerfile does not exist")
          else:
              dockerfiles = sorted(
                  path for path in root.rglob("Dockerfile")
                  if path.is_file() and len(path.relative_to(root).parts) <= 6
              )
              dockerfile = dockerfiles[0].resolve() if dockerfiles else None

          configured_context = os.environ["CONFIGURED_BUILD_CONTEXT"]
          if configured_context:
              context = resolve_relative(configured_context, kind="docker_build_context")
              if not context.is_dir():
                  raise SystemExit("BUILD_ERROR=configured Docker build context does not exist")
          else:
              context = dockerfile.parent if dockerfile else None

          if dockerfile is None or context is None:
              raise SystemExit("BUILD_ERROR=no Dockerfile available")
          print(dockerfile.relative_to(root))
          print(context.relative_to(root))
          PY
          )
          dockerfile="${container_paths[0]}"
          context="${container_paths[1]}"
          source_sha="${{ github.event.pull_request.head.sha || github.sha }}"
          commit_epoch="$(git show -s --format=%ct "$source_sha")"
          [[ "$commit_epoch" =~ ^[0-9]+$ ]]
          build_date="$(date --utc --date="@${commit_epoch}" '+%Y-%m-%dT%H:%M:%SZ')"
          docker build \
            --pull=false \
            --build-arg "SOURCE_SHA=${source_sha}" \
            --build-arg "BUILD_DATE=${build_date}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${source_sha}" \
            -f "$dockerfile" \
            -t "codestra-ci:${source_sha}" \
            "$context"

      - name: Emit source readiness summary
        run: |
          {
            echo "## Codestra deploy readiness"
            echo
            echo "- Contract: \`${DEPLOY_READINESS_CONTRACT_VERSION}\`"
            echo "- Repository class: \`${REPOSITORY_CLASS}\`"
            echo "- Exact source: \`${{ github.event.pull_request.head.sha || github.sha }}\`"
            echo "- Artifact strategy: \`${ARTIFACT_STRATEGY}\`"
            echo "- Runtime deployable: \`${RUNTIME_DEPLOYABLE}\`"
            echo "- Health paths: \`${HEALTH_PATHS}\`"
            echo "- Runtime deployment authorized by CI: **No**"
            echo "- External effects authorized by CI: **No**"
          } >> "$GITHUB_STEP_SUMMARY"

  secret-scan:
    name: deploy-readiness / secret-scan
    runs-on: [self-hosted, Linux, X64, codestra-ci]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install checksum-verified Gitleaks
        run: |
          set -Eeuo pipefail
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          chmod 0755 "$RUNNER_TEMP/gitleaks"

      - name: Scan tracked source and emit only sanitized metadata
        run: |
          set -Eeuo pipefail
          scan_root="${RUNNER_TEMP}/tracked-source"
          report="${RUNNER_TEMP}/gitleaks-report.json"
          mkdir -p "$scan_root"
          git archive HEAD | tar -x -C "$scan_root"
          set +e
          (
            cd "$scan_root"
            "$RUNNER_TEMP/gitleaks" dir \
              --no-banner \
              --redact \
              --report-format json \
              --report-path "$report" \
              --exit-code 1 \
              .
          )
          status=$?
          set -e
          python - "$report" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          findings = json.loads(path.read_text(encoding="utf-8")) if path.is_file() else []
          for finding in findings:
              print(
                  "SECRET_SCAN_FINDING="
                  f"rule:{finding.get('RuleID', 'unknown')};"
                  f"file:{finding.get('File', 'unknown')};"
                  f"line:{finding.get('StartLine', 'unknown')}"
              )
          print(f"SECRET_SCAN_FINDING_COUNT={len(findings)}")
          PY
          exit "$status"

  immutable-candidate:
    name: deploy-readiness / immutable-candidate
    needs:
      - source-ci
      - secret-scan
    if: >-
      (github.event_name == 'push' &&
       (github.ref_name == 'main' || github.ref_name == 'staging' || github.ref_name == 'production')) ||
      (github.event_name == 'workflow_dispatch' && inputs.operation != 'verify')
    runs-on: [self-hosted, Linux, X64, codestra-ci]
    timeout-minutes: 75
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    outputs:
      artifact_kind: ${{ steps.release.outputs.artifact_kind }}
      artifact_reference: ${{ steps.release.outputs.artifact_reference }}
      artifact_digest: ${{ steps.release.outputs.artifact_digest }}
    steps:
      - name: Restrict release authority
        run: |
          set -Eeuo pipefail
          case "${GITHUB_REF}" in
            refs/heads/main|refs/heads/staging|refs/heads/production) ;;
            *) echo "RELEASE_ERROR=release authority requires main, staging, or production" >&2; exit 1 ;;
          esac
          case "${{ inputs.operation }}" in
            verify|release|deploy-staging-readonly|certify-staging-readonly|promote-production-readonly) ;;
            *) echo "RELEASE_ERROR=unsupported operation" >&2; exit 1 ;;
          esac

      - name: Check out exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install checksum-verified Trivy and Cosign
        run: |
          set -Eeuo pipefail
          trivy_version="${TRIVY_VERSION#v}"
          trivy_archive="${RUNNER_TEMP}/trivy.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/trivy_${trivy_version}_Linux-64bit.tar.gz" \
            --output "$trivy_archive"
          echo "${TRIVY_SHA256}  ${trivy_archive}" | sha256sum --check --strict
          tar -xzf "$trivy_archive" -C "$RUNNER_TEMP" trivy
          chmod 0755 "$RUNNER_TEMP/trivy"

          cosign_bin="${RUNNER_TEMP}/cosign"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64" \
            --output "$cosign_bin"
          echo "${COSIGN_SHA256}  ${cosign_bin}" | sha256sum --check --strict
          chmod 0755 "$cosign_bin"

      - name: Build once, scan, publish, sign, and attest
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIGURED_DOCKERFILE: ${{ inputs.dockerfile_path }}
          CONFIGURED_BUILD_CONTEXT: ${{ inputs.docker_build_context }}
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          source_sha="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse HEAD^{tree})"
          test "$source_sha" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

          owner="${GITHUB_REPOSITORY%%/*}"
          raw_name="${GITHUB_REPOSITORY#*/}"
          image_name="$(printf '%s' "$raw_name" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^[._-]+//; s/[._-]+$//')"
          image_repo="ghcr.io/${owner}/${image_name}"
          readarray -t container_paths < <(python - <<'PY'
          import os
          import pathlib

          root = pathlib.Path.cwd().resolve()

          def resolve_relative(value: str, *, kind: str) -> pathlib.Path:
              candidate = pathlib.Path(value)
              if candidate.is_absolute() or ".." in candidate.parts:
                  raise SystemExit(f"RELEASE_ERROR={kind} must be repository-relative")
              resolved = (root / candidate).resolve()
              try:
                  resolved.relative_to(root)
              except ValueError:
                  raise SystemExit(f"RELEASE_ERROR={kind} escapes repository")
              return resolved

          configured_dockerfile = os.environ["CONFIGURED_DOCKERFILE"]
          if configured_dockerfile:
              dockerfile = resolve_relative(configured_dockerfile, kind="dockerfile_path")
              if not dockerfile.is_file():
                  raise SystemExit("RELEASE_ERROR=configured Dockerfile does not exist")
          else:
              dockerfiles = sorted(
                  path for path in root.rglob("Dockerfile")
                  if path.is_file() and len(path.relative_to(root).parts) <= 6
              )
              dockerfile = dockerfiles[0].resolve() if dockerfiles else None

          configured_context = os.environ["CONFIGURED_BUILD_CONTEXT"]
          if configured_context:
              context = resolve_relative(configured_context, kind="docker_build_context")
              if not context.is_dir():
                  raise SystemExit("RELEASE_ERROR=configured Docker build context does not exist")
          else:
              context = dockerfile.parent if dockerfile else None

          print(dockerfile.relative_to(root) if dockerfile else "")
          print(context.relative_to(root) if context else "")
          PY
          )
          dockerfile="${container_paths[0]}"
          context="${container_paths[1]}"

          python - <<'PY'
          import json
          import os
          import pathlib

          payload = {
              "buildDefinition": {
                  "buildType": "https://codestra.co/deploy-readiness/v2",
                  "externalParameters": {
                      "repository": os.environ["GITHUB_REPOSITORY"],
                      "source_sha": os.environ["GITHUB_SHA"],
                      "repository_class": os.environ["REPOSITORY_CLASS"],
                      "artifact_strategy": os.environ["ARTIFACT_STRATEGY"],
                  },
                  "internalParameters": {},
                  "resolvedDependencies": [{
                      "uri": f"git+https://github.com/{os.environ['GITHUB_REPOSITORY']}@{os.environ['GITHUB_SHA']}",
                      "digest": {"gitCommit": os.environ["GITHUB_SHA"]},
                  }],
              },
              "runDetails": {
                  "builder": {
                      "id": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}/attempts/{os.environ['GITHUB_RUN_ATTEMPT']}"
                  },
                  "metadata": {
                      "invocationId": f"{os.environ['GITHUB_RUN_ID']}:{os.environ['GITHUB_RUN_ATTEMPT']}"
                  },
                  "byproducts": [],
              },
          }
          pathlib.Path("evidence/provenance.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          use_image=false
          if [[ "$ARTIFACT_STRATEGY" == "oci" ]]; then
            [[ -n "$dockerfile" ]] || { echo "RELEASE_ERROR=oci strategy requires Dockerfile" >&2; exit 1; }
            use_image=true
          elif [[ "$ARTIFACT_STRATEGY" == "auto" && -n "$dockerfile" ]]; then
            use_image=true
          elif [[ "$ARTIFACT_STRATEGY" != "source-bundle" && "$ARTIFACT_STRATEGY" != "auto" ]]; then
            echo "RELEASE_ERROR=unsupported artifact strategy" >&2
            exit 1
          fi

          if [[ "$use_image" == true ]]; then
            tag="${image_repo}:sha-${source_sha}"
            commit_epoch="$(git show -s --format=%ct "$source_sha")"
            [[ "$commit_epoch" =~ ^[0-9]+$ ]]
            build_date="$(date --utc --date="@${commit_epoch}" '+%Y-%m-%dT%H:%M:%SZ')"
            build_date_pattern='^[0-9]{4}-[0-9]{2}-[0-9]{2}T'
            [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
            [[ "$build_date" =~ $build_date_pattern ]]
            docker build \
              --pull=false \
              --build-arg "SOURCE_SHA=${source_sha}" \
              --build-arg "BUILD_DATE=${build_date}" \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.revision=${source_sha}" \
              --label "org.opencontainers.image.version=sha-${source_sha}" \
              -f "$dockerfile" \
              -t "$tag" \
              "$context"

            "$RUNNER_TEMP/trivy" image \
              --exit-code 1 \
              --severity HIGH,CRITICAL \
              --format json \
              --output evidence/vulnerability-report.json \
              "$tag"
            "$RUNNER_TEMP/trivy" image \
              --format spdx-json \
              --output evidence/sbom.spdx.json \
              "$tag"

            printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            docker push "$tag" | tee "${RUNNER_TEMP}/docker-push.log"
            digest="$(awk '/digest: sha256:/{print $3}' "${RUNNER_TEMP}/docker-push.log" | tail -n1)"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            subject="${image_repo}@${digest}"

            "$RUNNER_TEMP/cosign" sign --yes "$subject"
            caller_identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/codestra-deploy-readiness.yml@${GITHUB_REF}"
            called_identity_pattern='^https://github.com/ingtrader21-spec/(Infustruction-repo|Caddy)/.github/workflows/reusable-codestra-deploy-readiness.yml@.*$'
            "$RUNNER_TEMP/cosign" verify \
              --certificate-identity-regexp "^(${caller_identity}|${called_identity_pattern#^})" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$subject" > evidence/signature-verification.json
            "$RUNNER_TEMP/cosign" attest --yes --type spdxjson --predicate evidence/sbom.spdx.json "$subject"
            "$RUNNER_TEMP/cosign" attest --yes --type https://slsa.dev/provenance/v1 --predicate evidence/provenance.json "$subject"
            "$RUNNER_TEMP/cosign" verify-attestation \
              --type spdxjson \
              --certificate-identity-regexp "^(${caller_identity}|${called_identity_pattern#^})" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$subject" > evidence/sbom-attestation-verification.json
            "$RUNNER_TEMP/cosign" verify-attestation \
              --type https://slsa.dev/provenance/v1 \
              --certificate-identity-regexp "^(${caller_identity}|${called_identity_pattern#^})" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$subject" > evidence/provenance-attestation-verification.json

          python - "$image_repo" "$digest" <<'PROVENANCE_PY'
          # BEGIN CODESTRA_PROVENANCE_VALIDATOR
          # Semantic validation is additional to (never a replacement for) Cosign verification.
          # Embedded here because a reusable workflow checks out its caller's repository.
          import base64
          import binascii
          import json
          import os
          import pathlib
          import re
          import sys


          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError("duplicate_json_key")
                  result[key] = value
              return result


          def reject_constant(value):
              raise ValueError("nonfinite_json_number")


          DECODER = json.JSONDecoder(object_pairs_hook=unique_object, parse_constant=reject_constant)


          def strict_json(value):
              return json.loads(value, object_pairs_hook=unique_object, parse_constant=reject_constant)


          def validate_provenance(verified, expected, image_repo, digest, env):
              """Accept only the full generated predicate for this exact verified image/run."""
              if len(verified.encode("utf-8")) > 8 * 1024 * 1024:
                  raise ValueError("oversized_verification")
              if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
                  raise ValueError("invalid_digest")
              repository, source = env["GITHUB_REPOSITORY"], env["GITHUB_SHA"]
              run, attempt = env["GITHUB_RUN_ID"], env["GITHUB_RUN_ATTEMPT"]
              if not re.fullmatch(r"[0-9a-f]{40}", source) or not all(
                  re.fullmatch(r"[1-9][0-9]*", value) for value in (run, attempt)
              ):
                  raise ValueError("invalid_source_or_run")
              definition, details = expected["buildDefinition"], expected["runDetails"]
              if (
                  definition["buildType"] != "https://codestra.co/deploy-readiness/v2"
                  or definition["externalParameters"] != {
                      "repository": repository, "source_sha": source,
                      "repository_class": env["REPOSITORY_CLASS"],
                      "artifact_strategy": env["ARTIFACT_STRATEGY"],
                  }
                  or definition["resolvedDependencies"] != [{
                      "uri": f"git+https://github.com/{repository}@{source}",
                      "digest": {"gitCommit": source},
                  }]
                  or details["builder"] != {
                      "id": f"https://github.com/{repository}/actions/runs/{run}/attempts/{attempt}"
                  }
                  or details["metadata"] != {"invocationId": f"{run}:{attempt}"}
              ):
                  raise ValueError("generated_predicate_not_bound_to_run")
              envelopes, remaining = [], verified.strip()
              while remaining:
                  value, end = DECODER.raw_decode(remaining)
                  envelopes.extend(value if isinstance(value, list) else [value])
                  if len(envelopes) > 64:
                      raise ValueError("too_many_attestations")
                  remaining = remaining[end:].lstrip()
              matched = False
              for envelope in envelopes:
                  if not isinstance(envelope, dict) or envelope.get("payloadType") != "application/vnd.in-toto+json":
                      raise ValueError("invalid_dsse_envelope")
                  payload = envelope.get("payload")
                  if not isinstance(payload, str):
                      raise ValueError("invalid_dsse_payload")
                  statement = strict_json(base64.b64decode(payload, validate=True).decode("utf-8"))
                  if not isinstance(statement, dict):
                      raise ValueError("invalid_statement")
                  # Cosign v3.1.2 emits a v0.1 statement envelope even for a SLSA v1 predicate.
                  if (
                      statement.get("_type") == "https://in-toto.io/Statement/v0.1"
                      and statement.get("predicateType") == "https://slsa.dev/provenance/v1"
                      and statement.get("subject") == [{"name": image_repo, "digest": {"sha256": digest[7:]}}]
                      and statement.get("predicate") == expected
                  ):
                      matched = True
              if not matched:
                  raise ValueError("no_exact_provenance_match")


          if __name__ == "__main__":
              try:
                  validate_provenance(
                      pathlib.Path("evidence/provenance-attestation-verification.json").read_text(encoding="utf-8"),
                      strict_json(pathlib.Path("evidence/provenance.json").read_text(encoding="utf-8")),
                      sys.argv[1], sys.argv[2], os.environ,
                  )
              except (OSError, ValueError, TypeError, KeyError, IndexError, RecursionError, binascii.Error):
                  raise SystemExit("RELEASE_ERROR=invalid_provenance_evidence") from None
              print("PROVENANCE_SEMANTICS=PASS")
          # END CODESTRA_PROVENANCE_VALIDATOR
          PROVENANCE_PY

            artifact_kind=oci-image
            artifact_reference="$subject"
            artifact_digest="$digest"
          else
            "$RUNNER_TEMP/trivy" fs \
              --scanners vuln \
              --exit-code 1 \
              --severity HIGH,CRITICAL \
              --format json \
              --output evidence/vulnerability-report.json \
              .
            test -s evidence/vulnerability-report.json
            "$RUNNER_TEMP/trivy" fs \
              --format spdx-json \
              --output evidence/sbom.spdx.json \
              .
            test -s evidence/sbom.spdx.json
            git archive --format=tar.gz --output=evidence/source.tar.gz HEAD
          python - <<'PY'
          import hashlib
          import json
          import pathlib

          root = pathlib.Path(".")
          records = []
          for path in sorted(
              p for p in root.rglob("*")
              if p.is_file() and ".git" not in p.parts and "evidence" not in p.parts
          ):
              records.append({
                  "path": path.as_posix(),
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  "size": path.stat().st_size,
              })
          pathlib.Path("evidence/source-sbom.json").write_text(
              json.dumps({"schema_version": 1, "files": records}, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
            bundle_digest="sha256:$(sha256sum evidence/source.tar.gz | awk '{print $1}')"
            manifest=evidence/source-release-manifest.json
          python - "$bundle_digest" <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess
          import sys

          digest = sys.argv[1]
          payload = {
              "schema_version": 1,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source_sha": os.environ["GITHUB_SHA"],
              "source_tree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
              "bundle_digest": digest,
              "sbom_sha256": "sha256:" + hashlib.sha256(pathlib.Path("evidence/source-sbom.json").read_bytes()).hexdigest(),
              "provenance_sha256": "sha256:" + hashlib.sha256(pathlib.Path("evidence/provenance.json").read_bytes()).hexdigest(),
              "runtime_deployment_authorized": False,
              "external_effects_authorized": False,
          }
          pathlib.Path("evidence/source-release-manifest.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
            identity_pattern="^https://github.com/(${GITHUB_REPOSITORY}/.github/workflows/codestra-deploy-readiness.yml@${GITHUB_REF#refs/heads/}|ingtrader21-spec/(Infustruction-repo|Caddy)/.github/workflows/reusable-codestra-deploy-readiness.yml@.*)$"
            "$RUNNER_TEMP/cosign" sign-blob --yes --bundle evidence/source-release-manifest.sigstore.json "$manifest"
            "$RUNNER_TEMP/cosign" verify-blob \
              --bundle evidence/source-release-manifest.sigstore.json \
              --certificate-identity-regexp "$identity_pattern" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$manifest"
            tag="deploy-ready-${source_sha}"
            mapfile -d '' release_assets < <(find evidence -maxdepth 1 -type f -print0 | sort -z)
            [[ "${#release_assets[@]}" -gt 0 ]] || { echo "No regular release assets found" >&2; exit 1; }
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "${release_assets[@]}" --clobber
            else
              gh release create "$tag" "${release_assets[@]}" \
                --target "$source_sha" \
                --title "Deploy-ready source ${source_sha}" \
                --notes "Exact signed source/configuration candidate. Runtime deployment remains separately gated."
            fi
            artifact_kind=source-bundle
            artifact_reference="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"
            artifact_digest="$bundle_digest"
          fi

          python - "$artifact_kind" "$artifact_reference" "$artifact_digest" <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import sys

          kind, reference, digest = sys.argv[1:]
          evidence = pathlib.Path("evidence")
          payload = {
              "schema_version": 2,
              "contract_version": os.environ["DEPLOY_READINESS_CONTRACT_VERSION"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "repository_class": os.environ["REPOSITORY_CLASS"],
              "source_sha": os.environ["GITHUB_SHA"],
              "source_tree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
              "artifact_kind": kind,
              "artifact_reference": reference,
              "artifact_digest": digest,
              "health_paths": [item for item in os.environ["HEALTH_PATHS"].split(",") if item],
              "signature_required": True,
              "sbom_required": True,
              "provenance_required": True,
              "high_critical_vulnerabilities_allowed": False,
              "staging_environment": "staging-readonly",
              "production_environment": "production-readonly-canary",
              "production_canary_max_percent": 1,
              "production_allowed_methods": ["GET", "HEAD"],
              "runtime_deployment_authorized": False,
              "external_effects_authorized": False,
          }
          (evidence / "deploy-readiness-manifest.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          (
            cd evidence
            find . -maxdepth 1 -type f ! -name checksums.sha256 -print0 |
              sort -z |
              xargs -0 sha256sum > checksums.sha256
            sha256sum --check --strict checksums.sha256
          )
          echo "artifact_kind=${artifact_kind}" >> "$GITHUB_OUTPUT"
          echo "artifact_reference=${artifact_reference}" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=${artifact_digest}" >> "$GITHUB_OUTPUT"

      - name: Upload immutable candidate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deploy-ready-${{ github.ref_name }}-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90

  staging-readonly:
    name: deploy-readiness / staging-readonly
    needs:
      - immutable-candidate
    if: >-
      inputs.runtime_deployable &&
      github.event_name == 'workflow_dispatch' &&
      (inputs.operation == 'deploy-staging-readonly' || inputs.operation == 'certify-staging-readonly')
    runs-on:
      - self-hosted
      - codestra-staging
    timeout-minutes: 45
    environment:
      name: staging-readonly
    permissions:
      contents: read
    steps:
      - name: Enforce fixed staging confirmation
        env:
          OPERATION: ${{ inputs.operation }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          case "${OPERATION}:${CONFIRMATION}" in
            deploy-staging-readonly:DEPLOY_STAGING_READONLY) ;;
            certify-staging-readonly:CERTIFY_STAGING_READONLY) ;;
            *) echo "STAGING_ERROR=invalid fixed confirmation" >&2; exit 1 ;;
          esac
          test -x /usr/local/bin/codestra-deploy

      - name: Execute protected exact-artifact staging operation
        env:
          ARTIFACT_KIND: ${{ needs.immutable-candidate.outputs.artifact_kind }}
          ARTIFACT_REFERENCE: ${{ needs.immutable-candidate.outputs.artifact_reference }}
          ARTIFACT_DIGEST: ${{ needs.immutable-candidate.outputs.artifact_digest }}
          OPERATION: ${{ inputs.operation }}
        run: |
          set -Eeuo pipefail
          sudo -n /usr/local/bin/codestra-deploy "$OPERATION" \
            --repository "$GITHUB_REPOSITORY" \
            --source-sha "$GITHUB_SHA" \
            --artifact-kind "$ARTIFACT_KIND" \
            --artifact-reference "$ARTIFACT_REFERENCE" \
            --artifact-digest "$ARTIFACT_DIGEST" \
            --environment staging-readonly \
            --health-paths "$HEALTH_PATHS" \
            --read-only \
            --deny-external-effects \
            --evidence-output "$RUNNER_TEMP/staging-readiness-evidence.json"

      - name: Upload sanitized staging evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staging-readiness-${{ github.repository_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/staging-readiness-evidence.json
          if-no-files-found: error
          retention-days: 30

  production-readonly-canary:
    name: deploy-readiness / production-readonly-canary
    needs:
      - immutable-candidate
    if: >-
      inputs.runtime_deployable &&
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'promote-production-readonly'
    runs-on:
      - self-hosted
      - codestra-production-canary
    timeout-minutes: 60
    environment:
      name: production-readonly-canary
    permissions:
      contents: read
    steps:
      - name: Enforce fixed production confirmation and maximum one percent
        env:
          CANARY_PERCENT: ${{ inputs.canary_percent }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          test "$CONFIRMATION" = "PROMOTE_PRODUCTION_READONLY"
          python3 - <<'PY'
          import os
          value = float(os.environ["CANARY_PERCENT"])
          if not 0 < value <= 1:
              raise SystemExit("canary_percent must be greater than zero and no more than one")
          PY
          test -x /usr/local/bin/codestra-deploy

      - name: Promote the exact artifact through a GET/HEAD-only canary
        env:
          ARTIFACT_KIND: ${{ needs.immutable-candidate.outputs.artifact_kind }}
          ARTIFACT_REFERENCE: ${{ needs.immutable-candidate.outputs.artifact_reference }}
          ARTIFACT_DIGEST: ${{ needs.immutable-candidate.outputs.artifact_digest }}
          CANARY_PERCENT: ${{ inputs.canary_percent }}
        run: |
          set -Eeuo pipefail
          sudo -n /usr/local/bin/codestra-deploy promote-production-readonly \
            --repository "$GITHUB_REPOSITORY" \
            --source-sha "$GITHUB_SHA" \
            --artifact-kind "$ARTIFACT_KIND" \
            --artifact-reference "$ARTIFACT_REFERENCE" \
            --artifact-digest "$ARTIFACT_DIGEST" \
            --environment production-readonly-canary \
            --health-paths "$HEALTH_PATHS" \
            --read-only \
            --canary-percent "$CANARY_PERCENT" \
            --allowed-methods GET,HEAD \
            --require-staging-certification \
            --require-backup \
            --require-isolated-restore \
            --require-rollback-rehearsal \
            --deny-external-effects \
            --evidence-output "$RUNNER_TEMP/production-canary-evidence.json"

      - name: Upload sanitized production-canary evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-readonly-canary-${{ github.repository_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/production-canary-evidence.json
          if-no-files-found: error
          retention-days: 90
