name: Validate monitoring onboarding record
on:
  pull_request:
    paths:
      - MONITORING-INTEGRATION.md
      - monitoring-integration.v1.json
      - .github/workflows/monitoring-record.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  monitoring-record:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify source and onboarding contract
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          r = json.loads(Path("monitoring-integration.v1.json").read_text())
          assert r["repository"] == os.environ["EXPECTED_REPOSITORY"]
          assert r["repository_id"] == int(os.environ["EXPECTED_REPOSITORY_ID"])
          assert r["schema_version"] == 1 and r["api_operation_count"] == 36
          assert r["repository_inventory_count"] == 63
          assert r["activation_enabled"] is False
          assert r["runtime_coverage"] == "unverified"
          assert re.fullmatch(r"https://raw\.githubusercontent\.com/appolon1908/Middleware-/[a-f0-9]{40}/contracts/observability/integrated-monitoring\.openapi\.json", r["api_contract_url"])
          assert len(r["service_ids"]) == len(set(r["service_ids"]))
          if r["monitoring_profile"] == "release-and-dependency":
              assert not r["service_ids"]
              assert "image_digest" not in r["required_identity_fields"]
              assert "fresh_telemetry" not in r["completion_evidence_required"]
              assert r["runtime_onboarding_allowed"] is False
          if r.get("repository_lifecycle") == "archival":
              assert r["canonical_runtime_repository"] == "appolon1908/kyqra-crawler"
              assert r["runtime_onboarding_allowed"] is False
          assert set(r["signal_owners"]) == {"metrics", "logs", "traces", "alerts", "catalog", "errors", "security"}
          print("MONITORING_ONBOARDING_RECORD=PASS")
          PY
