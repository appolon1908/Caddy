name: Codestra deploy readiness

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      operation:
        required: true
        type: choice
        default: verify
        options: [verify, release, deploy-staging-readonly, certify-staging-readonly, promote-production-readonly]
      confirmation:
        required: false
        type: string
        default: ""
      canary_percent:
        required: false
        type: string
        default: "1"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  deploy-readiness:
    uses: ./.github/workflows/reusable-codestra-deploy-readiness.yml
    with:
      repository_class: edge-proxy
      run_stack_tests: false
      artifact_strategy: source-bundle
      runtime_deployable: true
      health_paths: "/api/v1/health"
      operation: ${{ github.event_name == 'workflow_dispatch' && inputs.operation || 'verify' }}
      confirmation: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation || '' }}
      canary_percent: ${{ github.event_name == 'workflow_dispatch' && inputs.canary_percent || '1' }}
